<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata — Fantasy Italia</title>
<meta name="robots" content="noindex">
<script>
  // Le pagine dei libri vengono rigenerate a intervalli: un titolo approvato
  // da poco può non avere ancora la sua pagina. Invece di mostrare un errore
  // si apre la scheda sul catalogo, che i dati li legge da Supabase.
  (function(){
    var m = /^\/libri\/([^\/]+)\/?$/.exec(location.pathname || '');
    if(m) location.replace('/?libro=' + m[1]);
  })();
</script>
<style>
  :root{ --bg:#0f1013; --ink:#e7e9ee; --muted:#a9adbb; --accent:#7aa6ff; --border:#232635; }
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,'Helvetica Neue',Arial;
       background:linear-gradient(180deg,#0f1013,#0d0e12 140vh);color:var(--ink);padding:24px}
  main{max-width:520px;background:#171923;border:1px solid var(--border);border-radius:14px;padding:20px}
  h1{font-size:20px;margin:0 0 10px 0}
  p{color:var(--muted);line-height:1.6;margin:0 0 14px 0}
  a{color:#9fc8ff;text-decoration:none;border:1px solid var(--border);border-radius:10px;padding:9px 12px;display:inline-block}
</style>
</head>
<body>
<main>
  <h1>Pagina non trovata</h1>
  <p>Questo indirizzo non corrisponde a nessuna pagina del sito. Nel catalogo trovi tutti i titoli censiti.</p>
  <p><a href="/">Vai al catalogo</a></p>
</main>
</body>
</html>
