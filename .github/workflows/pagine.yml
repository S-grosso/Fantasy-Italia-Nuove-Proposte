name: Pagine libro e copertine

on:
  # Ogni sei ore: una scheda approvata ha la sua pagina entro il giro dopo.
  # Nel frattempo il link funziona lo stesso, grazie al ripiego di 404.html.
  schedule:
    - cron: "0 */6 * * *"
  # Avviabile a mano dalla tab Actions, subito dopo un'approvazione
  workflow_dispatch:

# Serve per committare le pagine generate
permissions:
  contents: write

jobs:
  pagine:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5

      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: pip install requests pillow

      # Prima le copertine, poi le pagine: così le schede generate puntano
      # già alle immagini ospitate da noi. Se questo passaggio va storto le
      # pagine si fanno lo stesso, con le copertine vecchie.
      - name: Porta le copertine sul nostro Storage
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/copertine.py

      # I caratteri per le immagini di Instagram. Sulle macchine delle Actions
      # di solito ci sono gia': si installano solo se mancano, per non
      # allungare ogni giro di mezzo minuto.
      - name: Caratteri per le immagini
        run: |
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
          fi

      # Dopo le copertine: l'immagine si fa solo da una copertina gia' sul
      # nostro Storage. Non scrive niente nel repository, quindi non genera
      # commit; e se va storto, le pagine si fanno lo stesso.
      - name: Immagini per Instagram
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/immagini_social.py

      - name: Genera le pagine
        env:
          # Facoltativi: senza secrets lo script usa la chiave pubblica, che
          # legge le schede approvate esattamente come fa il sito.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/genera_pagine.py

      - name: Committa quello che è cambiato
        run: |
          if [ ! -d libri ] && [ ! -d articoli ]; then
            echo "Nessuna pagina prodotta."
            exit 0
          fi

          git config user.name  "Pagine libro"
          git config user.email "actions@github.com"

          # Si aggiungono solo i percorsi che esistono davvero: 'git add' su
          # una cartella mai creata fallisce e fermerebbe tutto il passaggio.
          PERCORSI="sitemap.xml robots.txt data/copertine-report.json"
          [ -d libri ]    && PERCORSI="$PERCORSI libri"
          [ -d articoli ] && PERCORSI="$PERCORSI articoli"
          git add -A $PERCORSI

          # --cached confronta con l'indice: vede anche i file nuovi e le
          # cartelle rimosse, che 'git diff' nudo si perderebbe.
          if git diff --cached --quiet; then
            echo "Pagine invariate: niente da committare."
            exit 0
          fi

          SCHEDE=$(find libri -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
          ARTICOLI=$(find articoli -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
          git commit -m "Pagine: $SCHEDE schede, $ARTICOLI articoli"

          # Lo Scout committa sullo stesso ramo: se è passato nel frattempo,
          # si riparte da capo invece di litigare sul push.
          git pull --rebase origin main
          git push
