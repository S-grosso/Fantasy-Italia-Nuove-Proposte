name: Scout nuove uscite

on:
  # Ogni lunedì alle 6:00 (ora italiana d'inverno; UTC non segue l'ora legale)
  schedule:
    - cron: "0 5 * * 1"
  # Avviabile a mano dalla tab Actions, utile per il backfill
  workflow_dispatch:
    inputs:
      dal:
        description: "Cerca uscite a partire da questa data (YYYY-MM-DD). Vuoto = ultimi 30 giorni."
        required: false
        type: string
      limite:
        description: "Massimo numero di candidati da classificare"
        required: false
        default: "120"
        type: string
      prova_classificatore:
        description: "Solo prova del classificatore: tre casi noti, nessuna fonte letta, niente scritto"
        required: false
        default: false
        type: boolean

# Serve per committare il backup del catalogo. Il permesso "models: read"
# serviva a GitHub Models, chiuso da GitHub il 30 luglio 2026.
permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    # Rete di sicurezza: se qualcosa si impianta, meglio fallire
    # in 40 minuti che restare appesi per ore.
    timeout-minutes: 40

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5

      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: pip install requests

      - name: Cerca le nuove uscite
        env:
          # Il classificatore: Google Gemini, piano gratuito.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
          # La service_role key ignora le regole di sicurezza del database:
          # serve allo Scout per leggere anche gli scarti e scrivere i
          # candidati. Vive solo qui, nei secrets del repository.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # La prova non legge le fonti e non scrive niente: dice solo se il
          # classificatore risponde e se i suoi verdetti su tre casi noti tornano.
          if [ "${{ inputs.prova_classificatore }}" = "true" ]; then
            python scripts/scout.py --prova-classificatore
            exit $?
          fi

          ARGS=""
          if [ -n "${{ inputs.dal }}" ]; then
            ARGS="$ARGS --dal ${{ inputs.dal }}"
          fi
          if [ -n "${{ inputs.limite }}" ]; then
            ARGS="$ARGS --limite ${{ inputs.limite }}"
          fi
          python scripts/scout.py $ARGS

      # Anche se lo Scout esce con errore: succede apposta quando il
      # classificatore non risponde, e il backup del catalogo resta valido.
      - name: Salva il backup del catalogo
        if: always()
        run: |
          # I candidati ora vanno su Supabase: qui si committa solo la copia
          # di sicurezza del catalogo, che il sito non usa ma che permette di
          # ricostruire tutto se il database sparisse.
          if [ ! -f data/catalogo.json ]; then
            echo "Nessun backup prodotto."
            exit 0
          fi

          git config user.name  "Scout"
          git config user.email "actions@github.com"
          git add data/catalogo.json

          # --cached confronta con l'indice: funziona anche su file nuovi,
          # a differenza di 'git diff' nudo che ignora i non tracciati.
          if git diff --cached --quiet; then
            echo "Catalogo invariato: niente da committare."
            exit 0
          fi

          QUANTI=$(python -c "import json;print(len(json.load(open('data/catalogo.json'))))")
          git commit -m "Backup catalogo: $QUANTI titoli"
          git push
