<!DOCTYPE html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notizie • Fantasy Italia</title>
<style>
body{margin:0;font-family:system-ui,Segoe UI,Roboto;background:#0f1013;color:#e7e9ee}
main{max-width:900px;margin:0 auto;padding:28px}
.panel{background:#171923;border:1px solid #232635;border-radius:14px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{margin:0 0 6px 0;font-size:24px;line-height:1.25}
.data{color:#a9adbb;font-size:13px;margin-bottom:18px}
.corpo{color:#cfd2db;line-height:1.7}
.corpo h2{color:#e7e9ee;font-size:20px;margin:22px 0 10px}
.corpo p{margin:0 0 14px}
.corpo a{color:#9fc8ff}
a.btn{display:inline-block;margin-top:18px;background:#151826;border:1px solid #232635;color:#e7e9ee;padding:9px 13px;border-radius:10px;text-decoration:none}
</style></head>
<body><main>
  <div class="panel">
    <h1 id="t">Caricamento…</h1>
    <div id="d" class="data"></div>
    <div id="b" class="corpo"></div>
    <a class="btn" href="index.html#notizie">← Torna all'app</a>
  </div>
</main>
<script>
(async function(){
  const SUPABASE_URL = 'https://nncnhlbaqnfqtjwembii.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_0prYsjRCftybZ7uQ7tTryA_D5N2r9kQ';

  const id = new URLSearchParams(location.search).get('id');
  if(!id){ document.getElementById('t').textContent = 'Notizia non trovata'; return; }

  // Filtra anche per status: un link a una bozza non deve mostrare nulla,
  // e comunque il database la rifiuterebbe a un visitatore non autenticato.
  const url = SUPABASE_URL + '/rest/v1/news'
            + '?select=title,body_html,published_at'
            + '&status=eq.published'
            + '&id=eq.' + encodeURIComponent(id)
            + '&apikey=' + SUPABASE_KEY;

  // Difesa in profondità: il testo è già ripulito quando viene salvato,
  // ma toglierlo anche qui costa poco e protegge da contenuti arrivati
  // per altre strade (per esempio l'importazione dal vecchio JSON).
  function ripulisci(html){
    const doc = new DOMParser().parseFromString(html || '', 'text/html');
    doc.querySelectorAll('script,iframe,object,embed,style,link,meta').forEach(e=>e.remove());
    doc.querySelectorAll('*').forEach(el=>{
      [...el.attributes].forEach(a=>{
        const n = a.name.toLowerCase(), v = (a.value||'').trim().toLowerCase();
        if(n.startsWith('on')) el.removeAttribute(a.name);
        if((n==='href'||n==='src') && v.startsWith('javascript:')) el.removeAttribute(a.name);
      });
    });
    return doc.body.innerHTML;
  }

  try{
    const res = await fetch(url, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const righe = await res.json();
    if(!righe.length){ document.getElementById('t').textContent = 'Notizia non trovata'; return; }

    const n = righe[0];
    document.title = n.title + ' • Fantasy Italia';
    document.getElementById('t').textContent = n.title || '(Senza titolo)';
    document.getElementById('d').textContent = n.published_at
      ? new Date(n.published_at).toLocaleDateString('it-IT',
          {day:'numeric', month:'long', year:'numeric'})
      : '';
    document.getElementById('b').innerHTML = ripulisci(n.body_html);
  }catch(e){
    document.getElementById('t').textContent = 'Errore nel caricamento';
    console.error(e);
  }
})();
</script>
</body></html>
